<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ICC Companion</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .login-tabs .btn {
            flex: 1;
            padding: 10px 6px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .login-tabs .btn i {
            margin-right: 5px;
        }
        .login-tabs .btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #f8faff;
            font-weight: 600;
        }
        .login-tabs .btn:nth-child(1):hover:not(.active) { border-color: #7c3aed; color: #7c3aed; }
        .login-tabs .btn:nth-child(1):hover:not(.active) i { color: #7c3aed; }
        .login-tabs .btn:nth-child(2):hover:not(.active) { border-color: #0891b2; color: #0891b2; }
        .login-tabs .btn:nth-child(2):hover:not(.active) i { color: #0891b2; }
        .login-tabs .btn:nth-child(3):hover:not(.active) { border-color: #d97706; color: #d97706; }
        .login-tabs .btn:nth-child(3):hover:not(.active) i { color: #d97706; }
        .login-tabs .btn:nth-child(1).active { border-color: #7c3aed; }
        .login-tabs .btn:nth-child(1).active i { color: #7c3aed; }
        .login-tabs .btn:nth-child(2).active { border-color: #0891b2; }
        .login-tabs .btn:nth-child(2).active i { color: #0891b2; }
        .login-tabs .btn:nth-child(3).active { border-color: #d97706; }
        .login-tabs .btn:nth-child(3).active,
        .login-tabs .btn:nth-child(3).active i { color: #d97706; }

        .quick-btn {
            flex: 1;
            padding: 14px 8px;
            border: 1.5px solid transparent;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }
        .quick-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .quick-btn:active {
            transform: translateY(0);
        }
        .quick-btn i {
            font-size: 20px;
        }
        .quick-btn.qb-faculty { background: #f5f3ff; color: #7c3aed; }
        .quick-btn.qb-faculty:hover { background: #ede9fe; border-color: #7c3aed; }
        .quick-btn.qb-hod { background: #ecfeff; color: #0891b2; }
        .quick-btn.qb-hod:hover { background: #cffafe; border-color: #0891b2; }
        .quick-btn.qb-principal { background: #fffbeb; color: #d97706; }
        .quick-btn.qb-principal:hover { background: #fef3c7; border-color: #d97706; }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-lock"></i></div>
            </div>
            <h1>Admin Login</h1>
            <p class="subtitle">ICC Companion</p>

            <div id="errorMsg" class="alert alert-error hidden"></div>

            <div class="login-tabs">
                <button type="button" class="btn active" id="facultyTab" onclick="setLoginType('faculty')"><i class="fas fa-user-tie"></i> Faculty</button>
                <button type="button" class="btn" id="hodTab" onclick="setLoginType('dept-admin')"><i class="fas fa-building"></i> HOD</button>
                <button type="button" class="btn" id="principalTab" onclick="setLoginType('super-admin')"><i class="fas fa-crown"></i> Principal</button>
            </div>

            <form id="loginForm">
                <input type="hidden" id="loginType" value="faculty">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">Login as Faculty</button>
            </form>

            <div class="demo-section">
                <p class="demo-label">Quick Demo Access</p>
                <div class="demo-grid">
                    <button type="button" class="quick-btn qb-faculty" onclick="quickLogin('faculty')">
                        <i class="fas fa-user-tie"></i>
                        <span>Faculty</span>
                    </button>
                    <button type="button" class="quick-btn qb-hod" onclick="quickLogin('dept-admin')">
                        <i class="fas fa-building"></i>
                        <span>HOD</span>
                    </button>
                    <button type="button" class="quick-btn qb-principal" onclick="quickLogin('super-admin')">
                        <i class="fas fa-crown"></i>
                        <span>Principal</span>
                    </button>
                </div>
            </div>

            <div class="switch-login">
                <a href="index.html">← Back to Home</a>
            </div>

        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Check if running on Live Server
        if (window.location.port === '5500') {
            alert('CRITICAL: You are using VS Code Live Server (port 5500). PHP will NOT work here.\n\nPlease use: http://localhost/ICC_Companion/admin-login.html');
            document.body.innerHTML = '<div style="background:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; text-align:center; padding:20px;"><h1 style="color:#e11d48; margin-bottom:10px;">XAMPP Required</h1><p style="color:#4b5563; font-size:18px;">This project requires a PHP server. Please use the URL below:</p><code style="background:#f3f4f6; padding:10px 20px; border-radius:8px; font-weight:bold; margin:20px 0; color:#1f2937;">http://localhost/ICC_Companion/admin-login.html</code><p><a href="http://localhost/ICC_Companion/admin-login.html" style="color:#2563eb; text-decoration:none; font-weight:bold;">Click here to open in XAMPP</a></p></div>';
            throw new Error('PHP required');
        }

        function setLoginType(type) {
            document.getElementById('loginType').value = type;
            
            // Reset all tabs
            document.getElementById('facultyTab').classList.remove('active');
            document.getElementById('hodTab').classList.remove('active');
            document.getElementById('principalTab').classList.remove('active');
            
            if (type === 'faculty') {
                document.getElementById('facultyTab').classList.add('active');
                document.getElementById('loginBtn').textContent = 'Login as Faculty';
            } else if (type === 'dept-admin') {
                document.getElementById('hodTab').classList.add('active');
                document.getElementById('loginBtn').textContent = 'Login as HOD';
            } else if (type === 'super-admin') {
                document.getElementById('principalTab').classList.add('active');
                document.getElementById('loginBtn').textContent = 'Login as Principal';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var expectedRole = document.getElementById('loginType').value;
            var errorMsg = document.getElementById('errorMsg');

            // Hide previous error
            errorMsg.classList.add('hidden');

            // Validate inputs
            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Send login request
            var formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            fetch('api/admin-login.php', {
                method: 'POST',
                body: formData
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (data.success) {
                        // Check if role matches what was selected to prevent accidental wrong tab login
                        if (data.data.role !== expectedRole) {
                            var roleDisplay = expectedRole === 'super-admin' ? 'Principal' : (expectedRole === 'dept-admin' ? 'HOD' : 'Faculty');
                            showError('This account is not registered as ' + roleDisplay + '. Please select the correct tab.');
                            return;
                        }

                        // Store admin info in session storage
                        sessionStorage.setItem('adminId', data.data.admin_id);
                        sessionStorage.setItem('adminName', data.data.name);
                        sessionStorage.setItem('adminRole', data.data.role);
                        sessionStorage.setItem('assignedDept', data.data.assigned_dept);
                        sessionStorage.setItem('assignedSemester', data.data.assigned_semester);

                        // Redirect to admin dashboard
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        showError(data.message);
                    }
                })
                .catch(function (error) {
                    showError('Login failed: ' + error.message);
                    console.error('Error:', error);
                });
        });

        function showError(message) {
            var errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        function quickLogin(role) {
            var creds = {
                'faculty': { user: 'staff', pass: 'staff123' },
                'dept-admin': { user: 'bca', pass: 'bca123' },
                'super-admin': { user: 'admin', pass: 'admin123' }
            };
            setLoginType(role);
            document.getElementById('username').value = creds[role].user;
            document.getElementById('password').value = creds[role].pass;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    </script>
</body>

</html>
