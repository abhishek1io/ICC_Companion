<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - ICC Companion</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quick-btn {
            padding: 14px 8px;
            border: 1.5px solid transparent;
            border-radius: 8px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .quick-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .quick-btn:active { transform: translateY(0); }
        .quick-btn i { font-size: 20px; }
        .quick-btn.qb-bca { background: #eff6ff; color: #2563eb; }
        .quick-btn.qb-bca:hover { background: #dbeafe; border-color: #2563eb; }
        .quick-btn.qb-bba { background: #ecfdf5; color: #059669; }
        .quick-btn.qb-bba:hover { background: #d1fae5; border-color: #059669; }
        .quick-btn.qb-bcom { background: #fffbeb; color: #d97706; }
        .quick-btn.qb-bcom:hover { background: #fef3c7; border-color: #d97706; }
        .quick-btn.qb-ba { background: #f5f3ff; color: #7c3aed; }
        .quick-btn.qb-ba:hover { background: #ede9fe; border-color: #7c3aed; }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-user-graduate"></i></div>
            </div>
            <h1>Student Login</h1>
            <p class="subtitle">ICC Companion</p>

            <div id="errorMsg" class="alert alert-error hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" name="rollNumber" placeholder="e.g., UT-123-456-7890" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="demo-section">
                <p class="demo-label">Quick Demo Access</p>
                <div class="demo-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button type="button" class="quick-btn qb-bba" onclick="quickLogin('UT-221-050-0001', '2003-03-10')">
                        <i class="fas fa-chart-line"></i>
                        <span>BBA</span>
                    </button>
                    <button type="button" class="quick-btn qb-bca" onclick="quickLogin('UT-231-049-0004', '2003-03-25')">
                        <i class="fas fa-laptop-code"></i>
                        <span>BCA</span>
                    </button>
                    <button type="button" class="quick-btn qb-ba" onclick="quickLogin('UT-221-051-0001', '2003-04-25')">
                        <i class="fas fa-book-open"></i>
                        <span>BA</span>
                    </button>
                    <button type="button" class="quick-btn qb-bcom" onclick="quickLogin('UT-221-052-0001', '2003-05-08')">
                        <i class="fas fa-calculator"></i>
                        <span>B.Com</span>
                    </button>
                </div>
            </div>

            <div class="switch-login">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Check if running on Live Server
        if (window.location.port === '5500') {
            alert('CRITICAL: You are using VS Code Live Server (port 5500). PHP will NOT work here.\n\nPlease use: http://localhost/ICC_Companion/student-login.html');
            document.body.innerHTML = '<div style="background:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; text-align:center; padding:20px;"><h1 style="color:#e11d48; margin-bottom:10px;">XAMPP Required</h1><p style="color:#4b5563; font-size:18px;">This project requires a PHP server. Please use the URL below:</p><code style="background:#f3f4f6; padding:10px 20px; border-radius:8px; font-weight:bold; margin:20px 0; color:#1f2937;">http://localhost/ICC_Companion/student-login.html</code><p><a href="http://localhost/ICC_Companion/student-login.html" style="color:#2563eb; text-decoration:none; font-weight:bold;">Click here to open in XAMPP</a></p></div>';
            throw new Error('PHP required');
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();

            var rollNumber = document.getElementById('rollNumber').value.trim().toUpperCase();
            var dob = document.getElementById('dob').value;
            var errorMsg = document.getElementById('errorMsg');

            // Hide previous error
            errorMsg.classList.add('hidden');

            // Validate inputs
            if (!rollNumber || !dob) {
                showError('Please fill in all fields');
                return;
            }

            // Send login request
            var formData = new FormData();
            formData.append('roll_number', rollNumber);
            formData.append('dob', dob);

            fetch('api/student-login.php', {
                method: 'POST',
                body: formData
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    if (data.success) {
                        // Store student info in session storage
                        sessionStorage.setItem('studentRoll', data.data.roll_number);
                        sessionStorage.setItem('studentName', data.data.name);
                        sessionStorage.setItem('studentDept', data.data.dept_code);
                        sessionStorage.setItem('studentSemester', data.data.semester);

                        // Redirect to dashboard
                        window.location.href = 'student/dashboard.html';
                    } else {
                        showError(data.message);
                    }
                })
                .catch(function (error) {
                    showError('Login failed: ' + error.message + '. Please ensure you are at http://localhost/ICC_Companion/');
                    console.error('Error:', error);
                });
        });

        function showError(message) {
            var errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.remove('hidden');
        }

        function quickLogin(roll, dob) {
            document.getElementById('rollNumber').value = roll;
            document.getElementById('dob').value = dob;
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    </script>
</body>

</html>
